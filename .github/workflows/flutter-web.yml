name: Flutter Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "news_data/**"
      - ".github/workflows/flutter-web.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "news_data/**"
      - ".github/workflows/flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build web
        working-directory: app
        run: flutter build web --release --base-href /DreamWorld/ --pwa-strategy=none

      - name: Новости планет
        run: |
          mkdir -p app/build/web/news news_data
          cp news_data/*.json app/build/web/news/ 2>/dev/null || true

      - name: SPA fallback
        run: cp app/build/web/index.html app/build/web/404.html

      - name: Build info
        run: |
          printf '{"id":"%s","date":"%s"}' "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > app/build/web/build.json
          cat app/build/web/build.json

      - name: Upload Web preview artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dreamworld-web-preview
          path: app/build/web
          if-no-files-found: error
          retention-days: 7

# GitHub Pages деплоится только через web-deploy.yml, чтобы не было гонки двух workflow.
