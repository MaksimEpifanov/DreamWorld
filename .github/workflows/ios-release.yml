name: iOS Release IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build iOS IPA (no codesign)
        working-directory: app
        run: flutter build ipa --release --no-codesign

      - name: Package IPA
        run: |
          cd app/build/ios/ipa
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r dream-world-ios-unsigned.ipa Payload
          mv dream-world-ios-unsigned.ipa ../../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-world-ios-ipa
          path: dream-world-ios-unsigned.ipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "Dreem World v1.0.0 (iOS IPA unsigned)"
          body: "Несigned IPA для iOS. Для установки на iPhone нужен AltStore, Sideloadly или подпись через Xcode/Certificate."
          files: dream-world-ios-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
