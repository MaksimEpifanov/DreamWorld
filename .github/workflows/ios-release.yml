name: iOS Release IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build without signing
        working-directory: app
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -archivePath Runner.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive | tail -30
          xcodebuild -exportArchive -archivePath Runner.xcarchive -exportPath build/ipa -exportOptionsPlist /dev/null CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tail -15 || true

      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          if [ -d "ios/build/ipa/Runner.app" ]; then
            cp -r ios/build/ipa/Runner.app Payload/
            zip -r dream-world-ios-unsigned.ipa Payload
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r dream-world-ios-unsigned.ipa Payload
          else
            find . -name "Runner.app" 2>&1 | head -10
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-world-ios-ipa
          path: app/dream-world-ios-unsigned.ipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "Dreem World v1.0.0 (iOS IPA unsigned)"
          body: "Несigned IPA для iOS. Установка через AltStore/Sideloadly."
          files: app/dream-world-ios-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
