name: iOS Release IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build for device
        working-directory: app
        run: |
          flutter build ios --release --no-codesign || true

      - name: Package device build
        working-directory: app
        run: |
          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r ../dream-world-ios-device-unsigned.ipa Payload
            echo "packaged device build"
            exit 0
          fi
          if [ -d "ios/build/Release-iphoneos/Runner.app" ]; then
            cp -r ios/build/Release-iphoneos/Runner.app Payload/
            zip -r ../dream-world-ios-device-unsigned.ipa Payload
            echo "packaged from ios/build"
            exit 0
          fi
          find . -name "Runner.app" | head -10
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-world-ios-device
          path: dream-world-ios-device-unsigned.ipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "Dreem World v1.0.0 (iOS IPA unsigned)"
          body: "Несigned IPA для устройства iOS. Требуется подпись для установки на реальный iPhone (AltStore, Sideloadly)."
          files: dream-world-ios-device-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
