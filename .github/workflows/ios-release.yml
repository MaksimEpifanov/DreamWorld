name: iOS Release IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build IPA
        working-directory: app
        run: flutter build ipa --release --no-codesign || true

      - name: Find and package
        working-directory: app
        run: |
          find . -name "*.ipa" 2>&1 | head -10
          find . -name "Runner.app" 2>&1 | head -10
          if [ -f "build/ios/ipa/*.ipa" ] 2>/dev/null; then
            cp build/ios/ipa/*.ipa ../dream-world-ios-unsigned.ipa
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            mkdir -p Payload
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r ../dream-world-ios-unsigned.ipa Payload
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            mkdir -p Payload
            cp -r build/ios/Release-iphoneos/Runner.app Payload/
            zip -r ../dream-world-ios-unsigned.ipa Payload
          else
            echo "No build output found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-world-ios-ipa
          path: dream-world-ios-unsigned.ipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "Dreem World v1.0.0 (iOS IPA unsigned)"
          body: "Несigned IPA для iOS. Установка через AltStore/Sideloadly."
          files: dream-world-ios-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
