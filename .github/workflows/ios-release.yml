name: iOS Release IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build for simulator
        working-directory: app
        run: flutter build ios --simulator --no-codesign

      - name: Package
        working-directory: app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r ../dream-world-ios-simulator.ipa Payload
          echo "---"
          ls -lh ../dream-world-ios-simulator.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-world-ios-simulator
          path: dream-world-ios-simulator.ipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios-sim
          name: "Dreem World v1.0.0 (iOS Simulator)"
          body: "Сборка для симулятора iOS. Для реального iPhone требуется подпись (AltStore/Sideloadly) с сертификатом разработчика."
          files: dream-world-ios-simulator.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
