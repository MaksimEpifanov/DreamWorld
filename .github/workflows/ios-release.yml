name: iOS Release IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r ../../../dream-world-ios-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-world-ios-ipa
          path: dream-world-ios-unsigned.ipa

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "Dreem World v1.0.0 (iOS IPA unsigned)"
          body: "Несigned IPA для iOS. Установка через AltStore/Sideloadly."
          files: dream-world-ios-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
