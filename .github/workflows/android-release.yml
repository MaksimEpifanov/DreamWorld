name: Android Release APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android-release.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Подготовить ключ подписи
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан, APK будет подписан debug-ключом и не сможет обновить предыдущую установку."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/dreemworld-release.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=dreemworld\n'
            printf 'storeFile=dreemworld-release.jks\n'
            printf 'storeType=PKCS12\n'
          } > key.properties
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --build-number=$(( ${{ github.run_number }} + 100 )) --dart-define=NEWS_BASE_URL=https://maksimepifanov.github.io/DreamWorld/news
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreem-world-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.8
          name: "Dream World v1.1.8 (Android APK)"
          body: "Android APK из GitHub Actions. Исправлено отображение названия приложения: Dream World."
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
