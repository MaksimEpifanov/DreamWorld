<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dream World — галактика интересов: сообщества-планеты, чаты и поиск людей по ID.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050B1E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dream World">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dream World</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #12204a 0%, #050b1e 60%, #02040d 100%);
      color: #eae6ff;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }
    #dw-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #dw-boot .dw-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #b48cff;
      text-shadow: 0 0 22px rgba(180, 140, 255, 0.65);
    }
    #dw-boot .dw-sub {
      font-size: 14px;
      color: #a79fc7;
    }
    #dw-boot .dw-spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(180, 140, 255, 0.25);
      border-top-color: #b48cff;
      animation: dw-spin 0.9s linear infinite;
    }
    @keyframes dw-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="dw-boot">
    <div class="dw-title">DREAM WORLD</div>
    <div class="dw-spinner"></div>
    <div class="dw-sub">Загрузка галактики…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('dw-boot');
      if (boot) boot.remove();
    });

    // Сброс устаревшего кэша service worker: если в браузере остался
    // service worker от прошлых сборок, он отдаёт старые файлы и «пустой»
    // или сломанный интерфейс. Снимаем его, чистим кэши и один раз
    // перезагружаем страницу, чтобы загрузилась актуальная версия.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var RELOAD_KEY = 'dw-sw-reset';
      navigator.serviceWorker.getRegistrations().then(function (list) {
        var cacheJob = (window.caches && caches.keys)
          ? caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) {
                return caches.delete(key);
              }));
            })
          : Promise.resolve();
        if (!list.length) return cacheJob;
        var jobs = list.map(function (registration) {
          return registration.unregister();
        });
        return Promise.all(jobs.concat([cacheJob])).then(function () {
          if (sessionStorage.getItem(RELOAD_KEY) === '1') return;
          sessionStorage.setItem(RELOAD_KEY, '1');
          location.reload();
        });
      }).catch(function () {});
    })();
  </script>
  <script>
    // Автообновление сборки: сайт — одностраничное приложение, и уже
    // открытая вкладка продолжает работать на старом коде даже после нового
    // деплоя. Поэтому периодически и при возврате на вкладку сверяем метку
    // сборки (build.json пишется в CI) и один раз перезагружаем страницу,
    // когда на сервере появилась новая версия.
    (function () {
      var current = null;
      var reloading = false;
      function check() {
        if (reloading) return;
        fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (data) {
            if (!data || !data.id) return;
            if (current === null) {
              current = data.id;
              return;
            }
            if (data.id !== current) {
              reloading = true;
              location.reload();
            }
          })
          .catch(function () {});
      }
      check();
      setInterval(check, 300000);
      window.addEventListener('focus', check);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) check();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
